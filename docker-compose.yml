services:
  main-app:
    build: .
    image: ct-annotation/main-app:latest
    env_file:
      - .env
    environment:
      - FLASK_APP
      - FLASK_ENV
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SECRET_KEY
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      - db
    volumes:
      - .:/app
      - uploads-data:/app/uploads
    command: sh -c "flask db upgrade && gunicorn --bind 0.0.0.0:8000 app.wsgi:app"
    networks:
      - app-network

  ai-service:
    image: ct-annotation/ai-service:latest
    command: ["conda", "run", "--no-capture-output", "-n", "medsam2", "gunicorn", "-w", "10", "-b", "0.0.0.0:5000", "app:app"]
    deploy:
      placement:
        constraints:
          - node.labels.gpu == true
      resources:
        reservations:
          generic_resources:
            - discrete_resource_spec:
                kind: 'NVIDIA-GPU'
                value: 1
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-app
    networks:
      - app-network

volumes:
  pgdata:
  uploads-data:

networks:
  app-network:
    driver: overlay